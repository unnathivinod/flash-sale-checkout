# Runs on the "data" EC2 instance: Postgres + Redis + queue workers.
# Start with:  docker compose -f deploy/aws/docker-compose.data.yml --env-file deploy/aws/.env up -d --build
name: flashsale-data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: flashsale
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    ports: ["5432:5432"]          # reachable only from the API security group
    volumes:
      - ../../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flashsale"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb"]
    ports: ["6379:6379"]          # reachable only from the API security group
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  worker:
    build: ../..
    command: ["node", "src/worker.js"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql://flash:${DB_PASSWORD}@postgres:5432/flashsale
      QUEUE_BACKEND: redis
      WORKER_CONCURRENCY: "4"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
