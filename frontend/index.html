<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festival Phone Sale</title>
<meta name="description" content="500 phones at 8 PM. One per customer.">
<!-- Everything is inline: one request, no framework, under 10 KB. -->
<style>
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:#f7f7f8;color:#1f2937;
     min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:32px}
.tag{font-size:13px;font-weight:600;color:#6b7280;display:flex;align-items:center;gap:6px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#d1d5db}
.tag.live{color:#047857}.tag.live::before{background:#10b981}
.tag.out{color:#b91c1c}.tag.out::before{background:#ef4444}
h1{font-size:24px;font-weight:600;margin:6px 0 2px}
.muted{color:#6b7280;font-size:14px}
hr{border:0;border-top:1px solid #f0f0f2;margin:22px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k{font-size:13px;color:#6b7280}.v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#f0f0f2;border-radius:4px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#111827;border-radius:4px;transition:width .4s}
#buy{width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
#buy:hover:not(:disabled){background:#1f2937}
#buy:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}
#buy:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.msg{margin-top:14px;border-radius:8px;padding:12px;font-size:14px;display:none}
.msg.show{display:block}
.msg.wait{background:#f3f4f6;color:#374151}
.msg.ok{background:#ecfdf5;color:#047857}
.msg.bad{background:#fef2f2;color:#b91c1c}
.steps{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:#9ca3af;list-style:none;padding:0}
.steps li.done{color:#047857;font-weight:600}
.steps li.on{color:#111827;font-weight:600}
.foot{margin-top:18px;font-size:12px;color:#9ca3af;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <span class="tag" id="tag">Loading</span>
  <h1>Flash Phone X</h1>
  <p class="muted">8 GB RAM, 256 GB storage, 5G. One per customer.</p>
  <hr>
  <div class="grid">
    <div><div class="k">Price</div><div class="v">₹19,999</div></div>
    <div><div class="k" id="rightLabel">Left</div><div class="v" id="left">– / 500</div></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <hr>
  <button id="buy" disabled>Waiting for the sale</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <ol class="steps" id="steps" aria-label="Order progress">
    <li>Reserved</li><li>Queued</li><li>Confirmed</li>
  </ol>
  <p class="foot">Signed in as <span id="who"></span></p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const btn = $('buy'), msg = $('msg');

  // Simulated login: one stable guest id per browser tab.
  let user = sessionStorage.getItem('uid');
  if (!user) { user = 'guest-' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('uid', user); }
  $('who').textContent = user;

  let sale = null, offset = 0;        // last sale data; server clock minus ours
  let phase = 'idle';                 // idle -> reserving -> queued -> confirmed / soldout / failed
  const jitter = ms => ms * (0.8 + Math.random() * 0.4);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const show = (cls, text) => { msg.className = 'msg show ' + cls; msg.textContent = text; };

  // ---------- live sale data: Server-Sent Events, polling as fallback ----------
  function apply(s) {
    sale = s; offset = s.serverTime - Date.now();
    const left = Math.max(0, s.stockLeft), total = s.totalStock || 500;
    $('left').textContent = `${left} / ${total}`;
    $('bar').style.width = (left / total * 100) + '%';
    if (left <= 0 && phase === 'idle') { btn.disabled = true; btn.textContent = 'Sold out'; }
  }

  let sseFails = 0;
  function connect() {
    if (!window.EventSource) return poll();
    const es = new EventSource('/api/events');
    es.onmessage = e => { sseFails = 0; try { apply(JSON.parse(e.data)); } catch (_) {} };
    es.onerror = () => { if (++sseFails >= 3) { es.close(); poll(); } };   // SSE blocked? poll instead
  }
  async function poll() {
    try { const r = await fetch('/api/sale', { cache: 'no-store' }); if (r.ok) apply(await r.json()); } catch (_) {}
    if (sale && sale.status === 'SOLD_OUT') return;
    const near = sale && Math.abs(sale.startsAt - (Date.now() + offset)) < 10000;
    setTimeout(poll, jitter(near ? 1000 : 3000));          // jitter: users do not poll in lock-step
  }

  // ---------- countdown, synced to the server clock ----------
  function tick() {
    if (sale) {
      const ms = sale.startsAt - (Date.now() + offset), tag = $('tag');
      if (ms > 0) {
        const s = Math.ceil(ms / 1000);
        tag.className = 'tag'; tag.textContent = `Sale opens in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        if (phase === 'idle') { btn.disabled = true; btn.textContent = 'Waiting for the sale'; }
      } else if (sale.stockLeft > 0) {
        tag.className = 'tag live'; tag.textContent = 'Sale is live';
        if (phase === 'idle') { btn.disabled = false; btn.textContent = 'Reserve my phone'; }
      } else {
        tag.className = 'tag out'; tag.textContent = 'Sold out';
      }
    }
    setTimeout(tick, 250);
  }

  function steps(n) {
    [...$('steps').children].forEach((li, i) => { li.className = i < n ? 'done' : (i === n ? 'on' : ''); });
  }

  // ---------- the button: locked on the FIRST click ----------
  btn.addEventListener('click', async () => {
    if (phase !== 'idle') return;          // every later click is ignored
    phase = 'reserving';
    btn.disabled = true; btn.textContent = 'Reserving…';
    steps(0);
    show('wait', 'Holding your spot…');    // optimistic: answer before the server does
    await checkout(0);
  });

  async function checkout(attempt) {
    let r;
    try {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
      r = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: user }), signal: ctrl.signal });
      clearTimeout(t);
    } catch (_) { return retry(attempt, 'Connection dropped'); }   // safe: same user gets the same order

    if (r.status === 202) {
      const d = await r.json();
      phase = 'queued'; steps(1); btn.textContent = 'Reserved';
      show('wait', 'Phone reserved. Confirming your order…');
      return track(d.trackUrl, d.orderId);
    }
    if (r.status === 409) return end('bad', 'Sold out. All 500 phones were reserved before your request arrived.', 'Sold out');
    if (r.status === 425) { phase = 'idle'; return show('wait', 'The sale has not opened yet.'); }
    if (r.status === 429 || r.status >= 500) return retry(attempt, 'High traffic');
    return end('bad', 'Something went wrong. Refresh the page to try again.', 'Try again');
  }

  async function retry(attempt, why) {
    if (attempt >= 4) { phase = 'idle'; btn.disabled = false; btn.textContent = 'Reserve my phone'; steps(-1);
      return show('bad', why + '. Tap the button to try again.'); }
    const wait = jitter(Math.min(8000, 1000 * 2 ** attempt));       // 1s, 2s, 4s, 8s
    show('wait', `${why}. Retrying in ${Math.ceil(wait / 1000)}s…`);
    await sleep(wait);
    return checkout(attempt + 1);
  }

  async function track(url, id) {
    let delay = 400;
    for (let i = 0; i < 25; i++) {
      await sleep(jitter(delay));
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (r.ok) {
          const { status } = await r.json();
          if (status === 'CONFIRMED') { steps(3); return end('ok', `Order confirmed · ${id}`, 'Purchased'); }
          if (status !== 'QUEUED') return end('bad', 'This order could not be completed. You have not been charged.', 'Not completed');
        }
      } catch (_) {}
      delay = Math.min(delay * 1.5, 4000);
    }
    end('wait', 'Your phone is reserved. Confirmation is taking longer than usual.', 'Reserved');
  }

  function end(cls, text, label) { phase = 'done'; btn.disabled = true; btn.textContent = label; show(cls, text); }

  connect();
  fetch('/api/sale', { cache: 'no-store' }).then(r => r.json()).then(apply).catch(() => {});
  tick();
})();
</script>
</body>
</html>
