# NGINX = load balancer + bot blocker + rate limiter + static/edge cache.
# On AWS, the Application Load Balancer (+ WAF, CloudFront) does these jobs.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;  # lots of open connections at once
    multi_accept on;
}

http {
    access_log off;            # logging 100k requests/sec would slow us down
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    keepalive_requests 10000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ---- 1. Block obvious bots (empty or scripted User-Agents) ----
    map $http_user_agent $is_bot {
        default 0;
        ""      1;
        "~*(python-requests|scrapy|aiohttp|httpclient|bot|spider|crawler)" 1;
    }

    # ---- 2. Rate limit per client IP ----
    # Our own load test sends a secret header so it is not rate limited
    # (all its traffic comes from ONE IP). An empty key = no limit.
    map $http_x_loadtest_key $limit_key {
        default               $binary_remote_addr;
        "local-loadtest-only" "";
    }
    limit_req_zone $limit_key zone=checkout:20m rate=5r/s;   # a human clicks once; 5/s is generous
    limit_req_zone $limit_key zone=api:20m      rate=30r/s;
    limit_req_status 429;

    # ---- 3. Spread load across the 3 API replicas ----
    upstream api_cluster {
        least_conn;                         # send to the least busy server
        server api:8080 max_fails=3 fail_timeout=5s;
        keepalive 512;                      # reuse connections to the API
    }

    server {
        listen 80 backlog=65535;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout;  # one replica down? retry on another

        location = /api/checkout {
            if ($is_bot) { return 403; }
            client_max_body_size 1k;
            limit_req zone=checkout burst=10 nodelay;
            proxy_pass http://api_cluster;
        }

        location = /api/naive/checkout {
            if ($is_bot) { return 403; }
            limit_req zone=checkout burst=10 nodelay;
            proxy_pass http://api_cluster;
        }

        # Server-Sent Events: a long-lived stream, so no buffering and a long timeout
        location = /api/events {
            proxy_pass http://api_cluster;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering no;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api_cluster;
        }

        location = /healthz { proxy_pass http://api_cluster; }

        # ---- 4. Static files: served here, never by the API ("edge"/CDN role) ----
        root /usr/share/nginx/html;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";              # HTML: always check for a new version
        }
        location ~* \.(css|js|svg|png|webp|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
